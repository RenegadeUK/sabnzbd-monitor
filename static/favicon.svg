<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)" stroke="#fff" stroke-width="2"/>
  
  <!-- Download arrow -->
  <path d="M 50 25 L 50 55" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 35 45 L 50 60 L 65 45" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Base line -->
  <line x1="30" y1="70" x2="70" y2="70" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Monitoring dots -->
  <circle cx="30" cy="30" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="70" cy="30" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="30" cy="70" r="3" fill="#fff" opacity="0.8"/>
</svg>
